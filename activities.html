<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To my Nhe Nhe</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/activities.css" />
  </head>
  <body>
    <div id="activityquestion"><b>What should we do after? 🎡</b></div>
    <div class="activities-selection">
      <label class="activity-item">
        <input type="checkbox" name="activities" value="Aquarium" />
        <span class="activity-icon" aria-hidden="true">🐠</span>
        <span class="activity-label">Aquarium</span>
      </label>
      <label class="activity-item">
        <input type="checkbox" name="activities" value="Arcade" />
        <span class="activity-icon" aria-hidden="true">🕹️</span>
        <span class="activity-label">Arcade</span>
      </label>
      <label class="activity-item">
        <input type="checkbox" name="activities" value="Cinema" />
        <span class="activity-icon" aria-hidden="true">🎬</span>
        <span class="activity-label">Cinema</span>
      </label>
      <label class="activity-item">
        <input type="checkbox" name="activities" value="Figurine painting" />
        <span class="activity-icon" aria-hidden="true">🎨</span>
        <span class="activity-label">Figurine painting</span>
      </label>
      <label class="activity-item">
        <input type="checkbox" name="activities" value="Exhibition" />
        <span class="activity-icon" aria-hidden="true">🖼️</span>
        <span class="activity-label">Exhibition</span>
      </label>
      <label class="activity-item">
        <input type="checkbox" name="activities" value="Park" />
        <span class="activity-icon" aria-hidden="true">🌳</span>
        <span class="activity-label">Park</span>
      </label>
    </div>
    <button class="button" id="finaleBtn">To the finale 🎉</button>

    <script src="js/responses.js"></script>
    <script>
      document.getElementById("finaleBtn").addEventListener("click", function () {
        HangoutResponses.updateResponses({
          activities: HangoutResponses.getCheckedValues("activities"),
        });
        location.href = "lastpage.html";
      });
    </script>
  </body>
</html>
