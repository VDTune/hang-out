<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To my Nhe Nhe</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/dessert.css" />
  </head>
  <body>
    <div id="dessertquestion">What dessert should we have? 🍰</div>

    <div class="dessert-selection">
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Ice cream" />
        <span class="dessert-icon" aria-hidden="true">🍦</span>
        <span class="dessert-label">Ice cream</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Che" />
        <span class="dessert-icon" aria-hidden="true">🍡</span>
        <span class="dessert-label">Che</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Milk tea" />
        <span class="dessert-icon" aria-hidden="true">🧋</span>
        <span class="dessert-label">Milk tea</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Tofu pudding" />
        <span class="dessert-icon" aria-hidden="true">🍮</span>
        <span class="dessert-label">Tofu pudding</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Mixed fruit" />
        <span class="dessert-icon" aria-hidden="true">🍉</span>
        <span class="dessert-label">Mixed fruit</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Cake" />
        <span class="dessert-icon" aria-hidden="true">🍰</span>
        <span class="dessert-label">Cake</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Snacks" />
        <span class="dessert-icon" aria-hidden="true">🍿</span>
        <span class="dessert-label">Snacks</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Smoothie" />
        <span class="dessert-icon" aria-hidden="true">🥤</span>
        <span class="dessert-label">Smoothie</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Fruit tea" />
        <span class="dessert-icon" aria-hidden="true">🍹</span>
        <span class="dessert-label">Fruit tea</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Yogurt" />
        <span class="dessert-icon" aria-hidden="true">🥛</span>
        <span class="dessert-label">Yogurt</span>
      </label>
      <label class="dessert-item">
        <input type="checkbox" name="dessert" value="Coffee" />
        <span class="dessert-icon" aria-hidden="true">☕</span>
        <span class="dessert-label">Coffee</span>
      </label>
    </div>
    <button class="button" id="continueBtn">Continue 💫</button>

    <script src="js/responses.js"></script>
    <script>
      document.getElementById("continueBtn").addEventListener("click", function () {
        HangoutResponses.updateResponses({
          dessert: HangoutResponses.getCheckedValues("dessert"),
        });
        location.href = "activities.html";
      });
    </script>
  </body>
</html>
