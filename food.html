<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To my Nhe Nhe</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What do you want to eat? 🍽️</b>
    </div>

    <div class="food-selection">
      <label class="food-item">
        <input type="checkbox" name="food" value="Sushi" />
        <span class="food-icon" aria-hidden="true">🍣</span>
        <span class="food-label">Sushi</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Chinese" />
        <span class="food-icon" aria-hidden="true">🥡</span>
        <span class="food-label">Chinese</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Pizza" />
        <span class="food-icon" aria-hidden="true">🍕</span>
        <span class="food-label">Pizza</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Burger" />
        <span class="food-icon" aria-hidden="true">🍔</span>
        <span class="food-label">Burger</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Tacos" />
        <span class="food-icon" aria-hidden="true">🌮</span>
        <span class="food-label">Tacos</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Pasta" />
        <span class="food-icon" aria-hidden="true">🍝</span>
        <span class="food-label">Pasta</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Steakhouse" />
        <span class="food-icon" aria-hidden="true">🥩</span>
        <span class="food-label">Steakhouse</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Seafood" />
        <span class="food-icon" aria-hidden="true">🦞</span>
        <span class="food-label">Seafood</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Vegetarian" />
        <span class="food-icon" aria-hidden="true">🥗</span>
        <span class="food-label">Vegetarian</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Fondue" />
        <span class="food-icon" aria-hidden="true">🫕</span>
        <span class="food-label">Fondue</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Ramen" />
        <span class="food-icon" aria-hidden="true">🍜</span>
        <span class="food-label">Ramen</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Indian" />
        <span class="food-icon" aria-hidden="true">🍛</span>
        <span class="food-label">Indian</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Lebanese" />
        <span class="food-icon" aria-hidden="true">🧆</span>
        <span class="food-label">Lebanese</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Tapas" />
        <span class="food-icon" aria-hidden="true">🍷</span>
        <span class="food-label">Tapas</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Fine dining" />
        <span class="food-icon" aria-hidden="true">🍽️</span>
        <span class="food-label">Fine dining</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Greek" />
        <span class="food-icon" aria-hidden="true">🫒</span>
        <span class="food-label">Greek</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Turkish" />
        <span class="food-icon" aria-hidden="true">🥙</span>
        <span class="food-label">Turkish</span>
      </label>
      <label class="food-item">
        <input type="checkbox" name="food" value="Traditional" />
        <span class="food-icon" aria-hidden="true">🍲</span>
        <span class="food-label">Traditional</span>
      </label>
    </div>
    <button class="button" id="continueBtn">Continue 💫</button>

    <script src="js/responses.js"></script>
    <script>
      document.getElementById("continueBtn").addEventListener("click", function () {
        HangoutResponses.updateResponses({
          food: HangoutResponses.getCheckedValues("food"),
        });
        location.href = "dessert.html";
      });
    </script>
  </body>
</html>
